# Boat configuration. Self-contained: bringup launches nodes directly and
# does not include the per-package launch files, which stay in their own
# packages for debugging.
#
# Keys are /**/<node name> so they match the node in any namespace (bringup
# runs under /kingfisher by default). A bare <node name> key only matches a
# node at the root, and anything else is silently ignored. Frame names here
# are unprefixed; the launch files add frame_prefix where it is needed.

/**/kingfisher_serial:
  ros__parameters:
    # /dev/arduino is the stable symlink from /etc/udev/rules.d/10-arduino.rules
    port: "/dev/arduino"
    baud: 57600
    timeout: 5.0

/**/kingfisher_twist:
  ros__parameters:
    rotation_scale: 0.60
    fwd_speed_scale: 1.0
    rev_speed_scale: 1.0
    left_max: 1.0
    right_max: 1.0
    # seconds at zero thrust before reversing sign
    dead_time: 0.25

/**/wifi_monitor:
  ros__parameters:
    # MAC-derived name; changes if the dongle is swapped. Check `ip link`.
    dev: "wlx00c0ca91ebc1"
    hz: 1.0

/**/kingfisher_viz:
  ros__parameters:
    # overridden in base.launch.py with frame_prefix
    base_frame: "base_link"

/**/joint_state_publisher:
  ros__parameters:
    # The encoder's sail_joint is the only measured joint. The propeller
    # joints have no source and are published as 0.
    source_list: ["sail/joint_states"]
    # Hz. Also keeps sail_link TF fresh while the sail is still: the encoder
    # only publishes on change.
    rate: 20

# Phidgets drivers, in the container in launch/robot.launch.py. All three reach the wired VINT
# hub through the Phidget network server. The WiFi hub is "vint-wifi" at
# 192.168.100.1. Repeated per node: the rcl YAML parser has no anchors, and a
# bare /** block would apply to every node in this file (/**/<name> only
# matches that node).

/**/phidgets_digital_inputs:
  ros__parameters:
    server_name: "vint-wired"
    server_ip: "192.168.1.20"
    is_hub_port_device: false
    hub_port: 1
    # Leave publish_rate unset (0): the driver then publishes on every change.
    # Any positive rate disables that, and sail_calibration times the switch
    # edges from these messages.

/**/phidgets_high_speed_encoder:
  ros__parameters:
    server_name: "vint-wired"
    server_ip: "192.168.1.20"
    is_hub_port_device: false
    hub_port: 0
    # overridden in robot.launch.py with frame_prefix
    frame_id: "sail_motor_link"
    joint0_name: "sail_joint"
    # 2*pi / (14 * 300 * 4): 300 CPR, x4 quadrature, 14:1 reduction
    joint0_tick2rad: -0.00037399912542735635

/**/phidgets_stepper:
  ros__parameters:
    server_name: "vint-wired"
    server_ip: "192.168.1.20"
    is_hub_port_device: false
    hub_port: 2
    publish_rate: 2.0
    current_limit: 1.0
    holding_current_limit: 1.0
    # rad/s^2 (rescaled units)
    acceleration: 10.0
    # (1/16 step per count) * (1.8 deg per step) / 14:1 reduction, in rad
    rescale_factor: -0.00014024967203525864

/**/sail_calibration:
  ros__parameters:
    # rad/s. Search for the switch and the moves to center / offset.
    search_velocity: 2.0
    # rad/s. The two passes that measure the switch edges.
    measure_velocity: 0.2
    # rad, true zero relative to the switch center (-pi/2).
    # Sign depends on how the switch is mounted.
    zero_offset: 1.5707963
    # seconds between zeroing at the switch center and moving to the offset
    offset_move_delay: 0.8
    # rad, "arrived" threshold for the step moves
    position_tolerance: 0.001
    encoder_channel: 0
