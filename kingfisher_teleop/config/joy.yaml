# game_controller_node, on the machine the joystick is plugged into.
/**/game_controller_node:
  ros__parameters:
    # First stick found; list them with `ros2 run joy joy_enumerate_devices`
    device_id: 0
    deadzone: 0.05
    # Resend the last state while nothing changes.
    autorepeat_rate: 20.0
    # While a stick moves, publish at most every 50 ms (default 1 ms)
    coalesce_interval_ms: 50
